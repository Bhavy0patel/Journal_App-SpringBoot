spring:
  profiles:
    active: Dev  # means 'application-Dev.yml' this file will in use
     # we can use multiple profiles by sparaeting by coma ',' || Ex=  'active: Dev,Prod'

# Mainly in Prod and Dev Mongo sever, PW, configs will be changed

# This is default file; in real world default will not there, we needed to set which file we want to use in Env Variable
# Actually irl where server is used & No Default 'application.yml/.properties' we need to Run correct file by command as below

#mvn spring-boot:run "-Dspring-boot.run.profiles=Dev"  <-- we are saving JVM properties by it
#java -jar .\target\journal-0.0.1-SNAPSHOT.jar --spring.profiles.active=Dev
#|----running s-b application----------------| |-------passing args--------|

logging:
  level:
    net:
      Anonymous:
        journal: DEBUG #,TRACE also be used if want
#for using DEBUG in logging